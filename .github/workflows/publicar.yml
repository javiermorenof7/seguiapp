name: Publicar

# Cloudflare Pages: dev → vista previa (dev.seguiapp.pages.dev), main → producción. Los pull requests solo construyen.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - if: github.event_name == 'pull_request'
        run: npm run build:dev
      - run: npm run ${{ github.ref_name == 'dev' && 'build:dev' || 'build' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: publicacion
          path: dist
          retention-days: 1

  # El token solo existe en el environment production, que acepta únicamente dev y main. Este job no instala dependencias del proyecto.
  publicar:
    if: github.event_name != 'pull_request'
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.ref_name == 'main' && 'https://seguiapp.pages.dev' || format('https://{0}.seguiapp.pages.dev', github.ref_name) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publicacion
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx --yes wrangler@4.154.0 pages deploy dist --project-name seguiapp --branch "$RAMA" --commit-dirty=true
        env:
          RAMA: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
